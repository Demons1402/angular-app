<section>
    <div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
      <div class="card shadow">
        <div class="card-body">
          <h3 class="card-title text-center mb-4">Iniciar Sesión</h3>
          
          <form (ngSubmit)="iniciarSesion()" #loginForm="ngForm">
            
            <!-- CAMPO DE USUARIO -->
            <div class="mb-3">
              <label for="usuario" class="form-label">Usuario</label>
              <input type="text" id="usuario" class="form-control" placeholder="Ingresa tu usuario" 
                     [(ngModel)]="credenciales.usuario" name="usuario" required>
            </div>

            <!-- Campo de Contraseña -->
            <div class="mb-4">
              <label for="password" class="form-label">Contraseña</label>
              <input type="password" id="password" class="form-control" placeholder="********" 
                     [(ngModel)]="credenciales.password" name="password" required>
            </div>

            <!-- Botón de Envío -->
            <button type="submit" class="btn btn-primary w-100" [disabled]="loginForm.invalid">
              Ingresar
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
</section>
