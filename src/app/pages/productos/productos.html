<section>
    <div class="container my-5">
  <div class="text-center mb-5">
    <h1 class="fw-bold">Nuestros Automóviles Disponibles</h1>
    <p class="text-muted">Encuentra el modelo ideal para ti al mejor precio.</p>
  </div>

  <!-- Cuadrícula de Autos -->
  <div class="row row-cols-1 row-cols-md-3 g-4">
    
    <!-- Recorremos la lista de autos con *ngFor -->
    <div class="col" *ngFor="let auto of listaAutos">
      <div class="card h-100 shadow-sm">
        
        <!-- Imagen del Auto -->
        <img [src]="auto.imagen" class="card-img-top" alt="{{ auto.modelo }}" style="height: 200px; object-fit: cover;">
        
        <div class="card-body d-flex flex-column">
          <h5 class="card-title fw-bold">{{ auto.marca }} {{ auto.modelo }}</h5>
          <h6 class="text-primary mb-3">{{ auto.precio | currency:'USD':'symbol':'1.0-0' }}</h6>
          
          <!-- Características rápidas -->
          <ul class="list-unstyled small text-muted mb-4">
            <li><strong>Año:</strong> {{ auto.anio }}</li>
            <li><strong>Transmisión:</strong> {{ auto.transmision }}</li>
            <li><strong>Motor:</strong> {{ auto.motor }}</li>
          </ul>

          <!-- Botón de acción -->
          <button class="mt-auto btn btn-outline-dark w-100" (click)="cotizarAuto(auto.modelo)">
            Cotizar / Más Información
          </button>
        </div>

      </div>
    </div>

  </div>
</div>
</section>
